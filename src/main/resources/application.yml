server:
  port: 8123
  servlet:
    context-path: /api
spring:
  application:
    name: zh-picture-backend
  # 激活本地环境配置（application-local.yml 已被 .gitignore 忽略，存放数据库连接、COS 密钥等敏感信息）
  profiles:
    active: local
  # 数据库配置：见 application-local.yml（含账号密码，不入 Git 仓库）

# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zh.zhpicturebackend.controller

# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名包
  type-aliases-package: com.zh.zhpicturebackend.model.entity
  configuration:
    # 关闭驼峰转下划线映射：数据库列名本身为驼峰命名（如 userAccount），
    # 若开启，MyBatis-Plus 会将实体驼峰字段转为下划线列名（user_account）导致 Unknown column 报错
    map-underscore-to-camel-case: false
    # 开启二级缓存
    cache-enabled: true
    # 打印 SQL（开发阶段便于调试，生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除配置
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
# 对象存储 COS 配置：见 application-local.yml（含 SecretId/SecretKey 密钥，不入 Git 仓库）

# 用户模块配置
zh-picture:
  user:
    # 新增用户的初始密码（须满足 8~16 位密码规则；可通过环境变量 USER_DEFAULT_PASSWORD 覆盖，避免生产环境沿用仓库中的默认值）
    default-password: "${USER_DEFAULT_PASSWORD:ZhPicture@123}"


