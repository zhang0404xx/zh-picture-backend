server:
  port: 8123
  servlet:
    context-path: /api
spring:
  application:
    name: zh-picture-backend
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zh_picture?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # 配置数据库连接池
  hikari:
    maximum-pool-size: 10

# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zh.zhpicturebackend.controller

# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名包
  type-aliases-package: com.zh.zhpicturebackend.model.entity
  configuration:
    # 开启驼峰命名映射（数据库字段 -> Java 属性）
    map-underscore-to-camel-case: true
    # 开启二级缓存
    cache-enabled: true
    # 打印 SQL（开发阶段便于调试，生产环境建议关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除配置
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

